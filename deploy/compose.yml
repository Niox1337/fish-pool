name: fish

services:
  node:
    build:
      context: ..
      dockerfile: deploy/node.Dockerfile
      args:
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.8.0}
        CARGO_REGISTRY: ${CARGO_REGISTRY:-}
        APT_MIRROR: ${APT_MIRROR:-}
        PIP_INDEX: ${PIP_INDEX:-}
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.13-slim-trixie}
        NODE_BIN: ${NODE_BIN:-build}
    image: fish-node:latest
    restart: unless-stopped
    environment:
      FISH_NODE_ID: ${FISH_NODE_ID:-node-1}
      FISH_NODE_SECRET: ${FISH_NODE_SECRET:?set FISH_NODE_SECRET in deploy/.env}
      FISH_CONSOLE_URL: ${FISH_CONSOLE_URL:-https://fish.niox.lol}
      FISH_PLUGIN_IDLE_SECS: ${FISH_PLUGIN_IDLE_SECS:-1800}
      FISH_SIDECAR_TEMPLATES: ${FISH_SIDECAR_TEMPLATES:-1}
      FISH_SIDECAR_WARM_JIEBA: ${FISH_SIDECAR_WARM_JIEBA:-0}
      FISH_SIDECAR_WARM_FAISS: ${FISH_SIDECAR_WARM_FAISS:-0}
      RUST_LOG: ${RUST_LOG:-info}
      FISH_PIP_INDEX: ${PIP_INDEX:-}
    volumes:
      - fish-data:/data
    expose:
      - "8700"
    cgroup: private
    cap_add:
      - SYS_ADMIN
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    mem_limit: ${NODE_MEM_LIMIT:-2700m}
    pids_limit: 512
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  cloudflared:
    image: cloudflare/cloudflared:${CLOUDFLARED_TAG:-2025.4.0}
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in deploy/.env}
    depends_on:
      - node
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  fish-data:
