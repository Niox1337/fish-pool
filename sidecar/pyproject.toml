[project]
name = "fish-sidecar"
version = "0.1.0"
description = "Plugin host for fish: fork server that runs AstrBot plugins on top of the AstrBot package"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
# astrbot provides the plugin API and the sidecar imports it directly. The packages after it are
# libraries plugins often import without declaring them in requirements.txt.
dependencies = [
    "astrbot==4.29.4",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12",
    "colorlog>=6.8",
    "defusedxml>=0.7",
    "jinja2>=3.1",
    "lxml>=5.2",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fish_sidecar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# The fixture imports a missing name so the plugin fails to load
"tests/plugins/broken_plugin/main.py" = ["F401"]
