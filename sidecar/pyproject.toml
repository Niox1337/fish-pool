[project]
name = "fish-sidecar"
version = "0.1.0"
description = "Plugin host for fish: fork server and astrbot plugin API compatibility package"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "httpx>=0.27",
    "pydantic>=2.5",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fish_sidecar", "astrbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
